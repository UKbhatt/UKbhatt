
name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: UKbhatt

          template: classic
          base: ""

          config_timezone: Asia/Kolkata

          plugin_achievements: yes
          plugin_achievements_threshold: C

          plugin_isocalendar: yes

          plugin_languages: yes

          plugin_followup: yes

          plugin_trophies: yes
